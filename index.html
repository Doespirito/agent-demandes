<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Demandes — Compagnie des Guides</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a1a18; --ink2: #4a4a46; --ink3: #8a8a84;
    --bg: #f5f3ee; --bg2: #edeae3; --bg3: #e2ddd4;
    --gold: #b8860b; --gold-light: #f0e6c0;
    --green: #2d6a4f; --green-light: #d8f3dc;
    --red: #9b2226; --red-light: #fce4e4;
    --amber: #ca6702; --amber-light: #fef3e2;
    --border: rgba(26,26,24,0.12); --radius: 10px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; font-size: 14px; line-height: 1.6; }
  header { background: var(--ink); color: #f5f3ee; padding: 16px 32px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-family: 'DM Serif Display', serif; font-size: 18px; font-weight: 400; }
  header span { font-size: 12px; color: rgba(245,243,238,0.5); margin-left: auto; }
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: calc(100vh - 56px); }
  .panel-left { border-right: 1px solid var(--border); padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; }
  .panel-right { padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; }
  .section-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); margin-bottom: 8px; }
  textarea { width: 100%; min-height: 280px; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; line-height: 1.7; color: var(--ink); background: white; resize: vertical; outline: none; transition: border-color 0.2s; }
  textarea:focus { border-color: var(--gold); }
  textarea::placeholder { color: var(--ink3); }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; }
  .example-btn { font-size: 11px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 20px; background: white; color: var(--ink2); cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
  .example-btn:hover { background: var(--gold-light); border-color: var(--gold); color: var(--gold); }
  .btn-primary { background: var(--ink); color: var(--bg); border: none; padding: 12px 24px; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; align-self: flex-start; }
  .btn-primary:hover { background: #333; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: white; color: var(--ink); border: 1px solid var(--border); padding: 10px 18px; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .btn-secondary:hover { border-color: var(--ink); }
  .btn-confirm { background: var(--green); color: white; border: none; padding: 12px 24px; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; flex: 1; }
  .btn-confirm:hover { background: #1b4332; }
  .btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(245,243,238,0.3); border-top-color: var(--bg); border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fiche { background: white; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: none; }
  .fiche-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .fiche-header h2 { font-family: 'DM Serif Display', serif; font-size: 20px; font-weight: 400; }
  .badge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.04em; }
  .badge-b2c { background: var(--gold-light); color: var(--gold); }
  .badge-b2b { background: #dbeafe; color: #1e40af; }
  .badge-ambig { background: var(--amber-light); color: var(--amber); }
  .fiche-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 3px; }
  .field-row { display: grid; grid-template-columns: 140px 1fr; gap: 8px; align-items: start; padding: 7px 0; border-bottom: 1px solid var(--bg2); }
  .field-row:last-child { border-bottom: none; }
  .field-label { font-size: 12px; font-weight: 500; color: var(--ink3); padding-top: 2px; }
  .field-value { font-size: 13px; color: var(--ink); }
  .field-value input, .field-value select { width: 100%; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--ink); background: transparent; outline: none; transition: all 0.15s; }
  .field-value input:hover, .field-value select:hover { background: var(--bg); border-color: var(--border); }
  .field-value input:focus, .field-value select:focus { background: white; border-color: var(--gold); }
  .flag-missing { border-left: 3px solid var(--amber); padding-left: 8px; }
  .alert-missing { background: var(--amber-light); border: 1px solid rgba(202,103,2,0.2); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--amber); display: none; gap: 6px; align-items: flex-start; margin: 0 20px 4px; }
  .commentaires-box { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--ink2); font-style: italic; line-height: 1.6; border: 1px solid var(--bg3); min-height: 48px; outline: none; }
  .commentaires-box:focus { border-color: var(--gold); background: white; }
  .fiche-actions { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .status-bar { display: none; border-radius: var(--radius); padding: 12px 16px; font-size: 13px; align-items: center; gap: 8px; }
  .status-ok { background: var(--green-light); border: 1px solid rgba(45,106,79,0.2); color: var(--green); }
  .status-err { background: var(--red-light); border: 1px solid rgba(155,34,38,0.2); color: var(--red); }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; gap: 12px; color: var(--ink3); text-align: center; padding: 40px; }
  .empty-state svg { opacity: 0.2; }
  .empty-state p { font-size: 13px; }
  .note { font-size: 12px; color: var(--ink3); line-height: 1.5; padding: 10px 14px; background: var(--bg2); border-radius: 8px; }
</style>
</head>
<body>
<header>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h18M3 12h18M3 17h12"/></svg>
  <h1>Agent Demandes — Compagnie des Guides</h1>
  <span>Phase 1 · Extraction email → Fiche</span>
</header>
<div class="layout">
  <div class="panel-left">
    <div>
      <div class="section-label">Email reçu</div>
      <textarea id="emailInput" placeholder="Collez ici le texte de l'email client reçu sur contact@compagnie-guides.com…"></textarea>
    </div>
    <div>
      <div class="section-label" style="margin-bottom:6px">Exemples</div>
      <div class="examples">
        <button class="example-btn" onclick="loadExample('formulaire_simple')">Formulaire · Notre-Dame</button>
        <button class="example-btn" onclick="loadExample('formulaire_autre')">Formulaire · Visite custom</button>
        <button class="example-btn" onclick="loadExample('b2b_bnp')">B2B · BNP Paribas</button>
        <button class="example-btn" onclick="loadExample('b2b_digitalli')">B2B · Digitalli</button>
      </div>
    </div>
    <button class="btn-primary" id="analyzeBtn" onclick="analyzeEmail()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <span>Analyser cet email</span>
      <div class="spinner" id="spinner"></div>
    </button>
    <div class="note">L'agent extrait les informations clés et produit une fiche à valider. Les champs sont modifiables avant confirmation.</div>
  </div>
  <div class="panel-right">
    <div class="empty-state" id="emptyState">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <p>La fiche apparaîtra ici<br>après analyse de l'email</p>
    </div>
    <div class="fiche" id="ficheContainer">
      <div class="fiche-header">
        <h2 id="ficheTitle">—</h2>
        <span class="badge" id="ficheBadge"></span>
      </div>
      <div class="fiche-body" id="ficheBody"></div>
      <div class="alert-missing" id="alertMissing">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span id="alertMissingText"></span>
      </div>
      <div class="fiche-actions">
        <button class="btn-confirm" id="confirmBtn" onclick="confirmFiche()" disabled>Confirmer la fiche →</button>
        <button class="btn-secondary" onclick="resetFiche()">Effacer</button>
      </div>
    </div>
    <div class="status-bar" id="statusBar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="statusText"></span>
    </div>
  </div>
</div>
<script>
const EXAMPLES = {
  formulaire_simple: `De : Compagnie des Guides <contact@compagnie-guides.com>\nObjet : Demande de devis / nouvelle visite — Nouvelle demande\nÀ : contact@compagnie-guides.com\nRépondre à : dominique.belargent@gmail.com\n\nCLIENT\nPrénom : Dominique\nNom : Belargent\nE-mail : dominique.belargent@gmail.com\nTéléphone : 0675654749\n\nTYPE DE DEMANDE\nType : Demande de devis / nouvelle visite\nVisite souhaitée : Notre-Dame\n\nINFORMATIONS DE LA DEMANDE\nLangue souhaitée : Français\nNombre de participants : 3\n\nMESSAGE DU CLIENT\nBonjour, nous aimerions visiter ND le jeudi 7 mai de 9h à 11h30 (de préférence) ou le vend 8 mai de 10h00 à 12h00. Auriez-vous s'il vous plaît des possibilités sur ces horaires ? Merci.\n\nINFOS TECHNIQUES\nDate d'envoi : 2 mai 2026`,
  formulaire_autre: `CLIENT\nPrénom : MILOUD\nNom : BETTAYEB — CABINET DES ENTREPRENEURS\nE-mail : miloud@cabinet-entrepreneurs.fr\nTéléphone : 0624020547\n\nTYPE DE DEMANDE\nType : Demande de devis / nouvelle visite\nVisite souhaitée : Autre\nSi autre : VISITE HISTORIQUE DES SITES PRINCIPAUX DE PARIS\n\nINFORMATIONS DE LA DEMANDE\nLangue souhaitée : Français\nNombre de participants : 8\n\nMESSAGE DU CLIENT\nBonjour, nous sommes une petite société. Pour une activité de Team building pour 8 salariés, nous souhaitons une visite guidée de paris des principaux sites parisiens sans pour autant visiter l'intérieur des lieux. L'idéal serait un/une guide avec des anecdotes historiques\n\nINFOS TECHNIQUES\nDate d'envoi : 1 mai 2026`,
  b2b_bnp: `B2B inbound (site)\n\nType : Team building\nParticipants : 13–24\nDate/période : 27 mai 2026\nLangue : Français\nEntreprise : BNP Paribas\nContact : Philippe GABOREAU\nTéléphone : +33 7 60 20 33 69\nEmail : philippe.gaboreau@bnpparibas.com\n\nBonjour, pourriez-vous me proposer un devis pour un groupe de 17 personnes le mercredi 27 mai de 16h à 18h :\n– soit des passages couverts de Paris (Paris 2ème)\n– soit de la bibliothèque nationale (Richelieu)\nJe vous en remercie\nPhilippe`,
  b2b_digitalli: `Type : Team building\nParticipants : 50+\nDate/période : Septembre\nEntreprise : Marcopolette pour Digitalli\nTéléphone : 0645750969\nEmail : anne.boileau@marcopolette.fr\n\nBonjour, nous sommes en train d'imaginer une journée pour les 15 ans de l'entreprise Digitalli. Ils sont 65 collaborateurs et nous aimerions compléter avec une visite originale culturelle de Notre Dame de Paris. Que pouvez-vous proposer ?\nMerci d'avance, Anne`
};

const PRODUITS = ['Notre-Dame','Musée du Louvre',"Musée d'Orsay",'Marais','Montmartre','Sainte-Chapelle','Conciergerie','City tour en bus','Maisons closes','Paris des écrivains','Passages parisiens','Panthéon','Bourse de commerce','Île de la Cité','Troyes Centre historique','Reims','LaM Lille','Basilique de Saint-Denis','À définir'];
const LANGUES = ['Français','Anglais','Allemand','Espagnol','Italien','Autre'];

function loadExample(key) { document.getElementById('emailInput').value = EXAMPLES[key]; resetFiche(); }

function resetFiche() {
  document.getElementById('ficheContainer').style.display = 'none';
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('statusBar').style.display = 'none';
  document.getElementById('confirmBtn').disabled = true;
  document.getElementById('confirmBtn').textContent = 'Confirmer la fiche →';
}

async function analyzeEmail() {
  const emailText = document.getElementById('emailInput').value.trim();
  if (!emailText) return;
  const btn = document.getElementById('analyzeBtn');
  const spinner = document.getElementById('spinner');
  btn.disabled = true; spinner.style.display = 'block';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('ficheContainer').style.display = 'none';
  document.getElementById('statusBar').style.display = 'none';
  try {
    const response = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: emailText })
    });
    const fiche = await response.json();
    if (fiche.error) throw new Error(fiche.error);
    renderFiche(fiche);
  } catch(e) {
    const es = document.getElementById('emptyState');
    es.style.display = 'flex';
    es.querySelector('p').textContent = 'Erreur : ' + e.message;
  }
  btn.disabled = false; spinner.style.display = 'none';
}

function renderFiche(f) {
  document.getElementById('ficheTitle').textContent = f.produit || 'Visite à définir';
  const badge = document.getElementById('ficheBadge');
  if (f.type === 'B2B') { badge.textContent = 'B2B'; badge.className = 'badge badge-b2b'; }
  else if (f.produit_ambigu) { badge.textContent = 'À préciser'; badge.className = 'badge badge-ambig'; }
  else { badge.textContent = 'B2C'; badge.className = 'badge badge-b2c'; }

  const rows = [];
  rows.push(fieldRow('Produit / visite', f.produit, 'produit', 'select', PRODUITS, f.produit_ambigu));
  rows.push(fieldRow('Date', f.date, 'date', 'text', null, !f.date, f.date_note));
  rows.push(fieldRow('Heure', f.heure, 'heure', 'text', null, !f.heure));
  rows.push(fieldRow('Langue', f.langue, 'langue', 'select', LANGUES, !f.langue));
  rows.push(fieldRow('Nb participants', f.nb_pax ? String(f.nb_pax) : null, 'nb_pax', 'text', null, !f.nb_pax, f.nb_pax_note));
  rows.push(fieldRow('Contact', f.contact_nom, 'contact_nom', 'text', null, !f.contact_nom));
  rows.push(fieldRow('Email client', f.contact_email, 'contact_email', 'text', null, !f.contact_email));
  rows.push(fieldRow('Téléphone', f.contact_tel, 'contact_tel', 'text'));
  if (f.entreprise) rows.push(fieldRow('Entreprise', f.entreprise, 'entreprise', 'text'));
  rows.push(`<div class="field-row"><div class="field-label">Commentaires</div><div class="field-value"><div class="commentaires-box" contenteditable="true" id="field-commentaires">${f.commentaires || ''}</div></div></div>`);
  document.getElementById('ficheBody').innerHTML = rows.join('');

  const alertDiv = document.getElementById('alertMissing');
  if (f.champs_manquants && f.champs_manquants.length > 0) {
    alertDiv.style.display = 'flex';
    document.getElementById('alertMissingText').textContent = 'À compléter : ' + f.champs_manquants.join(', ');
  } else { alertDiv.style.display = 'none'; }

  document.getElementById('ficheContainer').style.display = 'block';
  document.getElementById('confirmBtn').disabled = false;
}

function fieldRow(label, value, id, type, options, missing, note) {
  const cls = missing ? 'field-value flag-missing' : 'field-value';
  let input;
  if (type === 'select' && options) {
    const opts = options.map(o => `<option value="${o}" ${o === value ? 'selected' : ''}>${o}</option>`).join('');
    input = `<select id="field-${id}">${!value ? '<option value="">— à sélectionner</option>' : ''}${opts}</select>`;
  } else {
    input = `<input type="text" id="field-${id}" value="${value || ''}" placeholder="${missing ? '⚠ manquant' : ''}">`;
  }
  const noteHtml = note ? `<div style="font-size:11px;color:var(--amber);margin-top:2px">${note}</div>` : '';
  return `<div class="field-row"><div class="field-label">${label}</div><div class="${cls}">${input}${noteHtml}</div></div>`;
}

function getField(id) {
  const el = document.getElementById('field-' + id);
  if (!el) return null;
  const v = el.tagName === 'DIV' ? el.textContent.trim() : el.value.trim();
  return v || null;
}

async function confirmFiche() {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  const data = {
    produit: getField('produit'), date: getField('date'), heure: getField('heure'),
    langue: getField('langue'), nb_pax: getField('nb_pax'),
    contact_nom: getField('contact_nom'), contact_email: getField('contact_email'),
    contact_tel: getField('contact_tel'), entreprise: getField('entreprise'),
    commentaires: getField('commentaires'),
    email_original: document.getElementById('emailInput').value.trim()
  };
  const statusBar = document.getElementById('statusBar');
  try {
    const response = await fetch('/api/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await response.json();
    if (result.error) throw new Error(result.error);
    statusBar.className = 'status-bar status-ok';
    document.getElementById('statusText').textContent = `✓ Fiche créée dans Airtable — ${result.titre} · N° commande : ${result.n_commande}`;
    statusBar.style.display = 'flex';
    btn.textContent = '✓ Enregistré';
  } catch(e) {
    statusBar.className = 'status-bar status-err';
    document.getElementById('statusText').textContent = 'Erreur : ' + e.message;
    statusBar.style.display = 'flex';
    btn.disabled = false; btn.textContent = 'Confirmer la fiche →';
  }
}
</script>
</body>
</html>
